workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      flutter: 3.22.2
      java: 17
      groups:
        - firebase_credentials   # optional: store google-services.json as env var
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: develop
          include: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "flutter.buildMode=debug" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

      - name: Get Flutter packages
        script: flutter pub get

      - name: Verify Flutter setup
        script: flutter doctor -v

      - name: Analyze code
        script: flutter analyze --no-fatal-warnings

      - name: Run unit tests
        script: flutter test --no-pub || true

      - name: Build debug APK
        script: |
          flutter build apk \
            --debug \
            --target-platform android-arm64 \
            --no-tree-shake-icons

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/app/outputs/logs/**

    publishing:
      email:
        recipients:
          - raj.k.pawar1990@gmail.com   # TODO: replace with your email
        notify:
          success: true
          failure: true

  android-release:
    name: Android Release AAB
    max_build_duration: 90
    environment:
      flutter: 3.22.2
      java: 17
      android_signing:
        - quiz_royale_keystore       # TODO: add keystore in Codemagic UI
      groups:
        - firebase_credentials
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build release AAB
        script: |
          flutter build appbundle \
            --release \
            --no-tree-shake-icons

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      email:
        recipients:
          - YOUR_EMAIL@example.com   # TODO: replace with your email
        notify:
          success: true
          failure: true
